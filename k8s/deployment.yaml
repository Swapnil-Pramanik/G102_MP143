apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp143-api
  labels:
    app: mp143-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp143-api
  template:
    metadata:
      labels:
        app: mp143-api
    spec:
      containers:
        - name: mp143-api
          image: mp143-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
