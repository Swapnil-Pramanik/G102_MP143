# MP143 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G102"          # your group id, e.g. "G042"
problem_id: "MP143"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: False
    column: None           # the column that must not be used as a feature
  unit_mixup:
    present: False
    column: None           # the column recorded in a different unit
    group_value: None      # the value of station_type whose rows are affected
    factor: None           # wrong value = right value x factor
  sentinel_value:
    present: True
    column: vehicle_age_yr  # the column with the sentinel
    value: -999            # the special number typed instead of a blank
    count: 61            # how many rows have it
  duplicate_rows:
    present: True
    count: 58            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: True
    column: battery_start_pct  # the column that sent the same reading for weeks
    start_date: 2026-02-27       # first date with the stuck value, YYYY-MM-DD
    end_date: 2026-03-15         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: True
    count: 14            # rows whose target was typed 10 times too big
  spelling_variants:
    present: False
    column: None           # the column with the spelling variants
    true_levels: None      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    battery_start_pct: null
    session_minutes: null
    charger_kw: null
    temp_c: null
    vehicle_age_yr: null
    queue_before: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of station_type
    'Mall': null
    'Highway': null
    'Residential': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
